<script>
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const params=new URLSearchParams(location.search);const id=params.get('id');const app=document.getElementById('app');
const fallbacks={
'3377':{id:'3377',title:'Figura Luffy Gear 5 – Nika – One Piece – 31 cm',description:'Figura coleccionable de Luffy Gear 5 / Nika de One Piece, 31 cm, realizada en PVC. Incluye figura y caja.',price:150000,active:true,images:['https://raw.githubusercontent.com/luisascuehidalgo-spec/imagenes/main/20241123034449_1.jpg','https://raw.githubusercontent.com/luisascuehidalgo-spec/imagenes/main/20241123034449_2.jpg','https://raw.githubusercontent.com/luisascuehidalgo-spec/imagenes/main/20241123034449_3.jpg']},
'3375':{id:'3375',title:'Figura One Piece Kaido Dragón 30 Cm PVC Coleccionable Anime',description:'Figura de Kaido Dragón de One Piece, 30 cm, realizada en PVC. Pieza coleccionable de gran presencia para exhibición.',price:300000,active:true,images:['https://raw.githubusercontent.com/luisascuehidalgo-spec/COD-3375/main/D_NQ_NP_2X_758000-MLA115602430906_092026-F.webp','https://raw.githubusercontent.com/luisascuehidalgo-spec/COD-3375/main/D_NQ_NP_2X_859621-MLA117043297919_092026-F.webp']},
'3431':{id:'3431',title:'FIGURA LUFFY GEAR 5 – NIKA – ONE PIECE – 23 CM',description:'Figura coleccionable de Luffy Gear 5 / Nika de One Piece, 23 cm. Ideal para colección y exhibición.',price:120000,active:true,images:['/api/product-image?id=2','/api/product-image?id=3']}
};
function setMeta(selector,value){const element=document.querySelector(selector);if(element)element.setAttribute('content',value)}
function updateProductSeo(p,first){const canonical=`https://mititoys.com/producto.html?id=${encodeURIComponent(p.id)}`;const description=String(p.description||p.title).replace(/\s+/g,' ').slice(0,155);document.title=`${p.title} | Mititoys`;document.querySelector('meta[name="description"]').setAttribute('content',description);document.getElementById('productCanonical').href=canonical;setMeta('meta[property="og:title"]',p.title);setMeta('meta[property="og:description"]',description);setMeta('meta[property="og:url"]',canonical);setMeta('meta[property="og:image"]',new URL(first,location.origin).href);setMeta('meta[name="twitter:title"]',p.title);setMeta('meta[name="twitter:description"]',description);setMeta('meta[name="twitter:image"]',new URL(first,location.origin).href);document.getElementById('productSchema').textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',name:p.title,description,image:(Array.isArray(p.images)?p.images:[]).map(url=>new URL(url,location.origin).href),sku:String(p.id),brand:{'@type':'Brand',name:'Mititoys'},offers:{'@type':'Offer',url:canonical,priceCurrency:'ARS',price:Number(p.price||0),availability:Number(p.stock_quantity||0)>0||!p.stock_managed?'https://schema.org/InStock':'https://schema.org/OutOfStock'}})}
function render(p){const imgs=(Array.isArray(p.images)?p.images:[]).filter(Boolean);const first=imgs[0]||'';updateProductSeo(p,first);app.className='product';app.innerHTML=`<div class="gallery"><div class="main"><span class="badge">COD ${esc(p.id)}</span><img id="mainImage" src="${esc(first)}" alt="${esc(p.title)}" width="720" height="720" fetchpriority="high" decoding="async"></div><div class="thumbs">${imgs.map((u,i)=>`<button type="button" class="thumb ${i===0?'active':''}" data-src="${esc(u)}" aria-label="Ver foto ${i+1} de ${esc(p.title)}"><img src="${esc(u)}" alt="" loading="lazy" decoding="async" width="120" height="120"></button>`).join('')}</div></div><aside class="info"><div class="eyebrow">FIGURA COLECCIONABLE · COD ${esc(p.id)}</div><h1>${esc(p.title)}</h1><div class="price">${money(p.price)}</div><div class="stock">✓ Publicado y disponible para comprar</div><div class="payment-note"><b>Pago protegido por Mercado Pago.</b> Podrás ver las cuotas y medios disponibles antes de confirmar.</div>
<div class="shipping-calc"><h2>🚚 Calculá tu envío</h2><p>Conocé el costo estimado a domicilio antes de agregar la figura al carrito.</p><div class="shipping-grid"><select id="productProvince"><option value="">Provincia</option><option value="C">CABA</option><option value="B">Buenos Aires</option><option value="K">Catamarca</option><option value="H">Chaco</option><option value="U">Chubut</option><option value="X">Córdoba</option><option value="W">Corrientes</option><option value="E">Entre Ríos</option><option value="P">Formosa</option><option value="Y">Jujuy</option><option value="L">La Pampa</option><option value="F">La Rioja</option><option value="M">Mendoza</option><option value="N">Misiones</option><option value="Q">Neuquén</option><option value="R">Río Negro</option><option value="A">Salta</option><option value="J">San Juan</option><option value="D">San Luis</option><option value="Z">Santa Cruz</option><option value="S">Santa Fe</option><option value="G">Santiago del Estero</option><option value="V">Tierra del Fuego</option><option value="T">Tucumán</option></select><input id="productPostal" inputmode="numeric" maxlength="8" placeholder="Código postal"><button id="productQuote">COTIZAR</button></div><div id="productShippingResult" class="shipping-result"></div></div><div class="actions"><button id="addBtn" class="btn cartbtn">🛒 AGREGAR AL CARRITO</button><button id="payBtn" class="btn pay">💳 COMPRAR CON MERCADO PAGO</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/541133466187?text=${encodeURIComponent('Hola, quiero consultar por la figura '+p.title+' COD '+p.id)}">💬 CONSULTAR POR WHATSAPP</a></div><div class="trust"><div>🔒<br>Pago seguro con Mercado Pago</div><div>📦<br>Producto para colección y exhibición</div><div>💬<br>Atención directa por WhatsApp</div></div><div class="description"><h2>Descripción del producto</h2><p>${esc(p.description||'Figura coleccionable de anime.')}</p></div><div class="reviews-box"><h2>Opiniones de compradores</h2><div class="reviews-summary">${Number(p.reviews_count||0)?'★ '+Number(p.rating||0).toFixed(1)+' · '+Number(p.reviews_count)+' opiniones verificadas':'Todavía no hay opiniones. Sé el primero después de tu compra.'}</div><div id="productReviews"></div></div></aside>`;
document.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click',()=>{document.getElementById('mainImage').src=t.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));t.classList.add('active')}));
document.getElementById('addBtn').addEventListener('click',e=>window.agregarAlCarrito(String(p.id),e.currentTarget));
document.getElementById('payBtn').addEventListener('click',e=>window.pagar(String(p.id),e.currentTarget));document.getElementById('productQuote').addEventListener('click',()=>quoteProductShipping(p));window.MitiToysAnalytics?.track('product_view',{product_id:String(p.id),price:Number(p.price||0)});loadProductReviews(p.id);}
async function quoteProductShipping(p){const province=document.getElementById('productProvince').value,postal=document.getElementById('productPostal').value.trim(),out=document.getElementById('productShippingResult'),button=document.getElementById('productQuote');if(!province||!/\d{4}/.test(postal)){out.textContent='Seleccioná la provincia e ingresá un código postal de 4 dígitos.';return}button.disabled=true;button.textContent='...';out.textContent='Consultando opciones reales...';try{const r=await fetch('/api/envios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:[{id:String(p.id),qty:1}],province_code:province,postal_code:postal,delivery_type:'home'})});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo cotizar.');const best=j.options?.[0];if(!best)throw new Error('No encontramos envíos para ese destino.');out.innerHTML='<b>'+esc(best.carrier_name)+' · '+money(best.amount)+'</b><br>'+(best.estimated_days?esc(best.estimated_days+' días estimados'):'Plazo a confirmar')+'<br><small>En el checkout vas a poder comparar todas las opciones.</small>'}catch(e){out.textContent=e.message||'No se pudo cotizar.'}finally{button.disabled=false;button.textContent='COTIZAR'}}
async function loadProductReviews(productId){const container=document.getElementById('productReviews');if(!container)return;try{const r=await fetch('/api/productos?id='+encodeURIComponent(productId)+'&cb='+Date.now(),{cache:'no-store'});const j=await r.json();const reviews=Array.isArray(j.reviews)?j.reviews:[];container.innerHTML=reviews.map(review=>'<div class="review"><b>'+'★'.repeat(Number(review.rating||0))+' '+esc(review.title||'Compra verificada')+'</b><p>'+esc(review.body||'')+'</p><small>✓ Compra verificada · '+esc(review.customer_name||'Cliente')+'</small></div>').join('')}catch(e){console.error(e)}}
function renderRelated(products,currentId){const others=products.filter(p=>p&&p.active!==false&&String(p.id)!==String(currentId)&&Array.isArray(p.images)&&p.images[0]).slice(0,3);if(!others.length)return;document.getElementById('related').hidden=false;document.getElementById('relatedGrid').innerHTML=others.map(p=>`<article class="related-card"><img src="${esc(p.images[0])}" alt="${esc(p.title)}" loading="lazy" decoding="async" width="360" height="230"><div class="rbody"><h3>${esc(p.title)}</h3><div class="rprice">${money(p.price)}</div><a href="/producto.html?id=${encodeURIComponent(p.id)}">VER PRODUCTO</a></div></article>`).join('')}
async function load(){if(!id){app.innerHTML='Producto no especificado. <a href="/#catalogo" style="color:#ffd21c">Volver al catálogo</a>';return}let products=[];try{const r=await fetch('/api/productos?cb='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();products=Array.isArray(j.products)?j.products:[]}}catch(e){console.error(e)}const p=products.find(x=>String(x.id)===String(id))||fallbacks[String(id)];if(!p||p.active===false){app.innerHTML='Este producto no está disponible. <a href="/#catalogo" style="color:#ffd21c">Ver catálogo</a>';return}render(p);const merged=[...products];Object.values(fallbacks).forEach(f=>{if(!merged.some(x=>String(x.id)===String(f.id)))merged.push(f)});renderRelated(merged,p.id)}
load();
</script>
