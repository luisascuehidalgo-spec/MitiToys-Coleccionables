<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Mititoys · Configuración de envíos</title>
  <style>
    :root{--yellow:#ffd21c;--red:#ef2525;--bg:#070707;--card:#121212;--line:#2c2c2c;--muted:#aaa;--green:#74dc70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1120px;margin:auto;padding:30px 18px 60px}a{color:var(--yellow);text-decoration:none}.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:21px;margin:18px 0}.hidden{display:none}h1,h2{color:var(--yellow)}.muted{color:var(--muted);line-height:1.5}.bad{color:#ff7373}.ok{color:var(--green)}.recovered{color:var(--yellow)}input,button{padding:11px;border-radius:8px;border:1px solid #444;background:#181818;color:#fff}button{background:var(--red);font-weight:900;cursor:pointer}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.product{background:#0e0e0e;border:1px solid var(--line);border-radius:12px;padding:17px}.product h3{font-size:17px;margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}label{display:grid;gap:6px;color:#ddd;font-size:13px;font-weight:700}input,button{padding:11px;border-radius:8px;border:1px solid #444;background:#181818;color:#fff}input{width:100%}button{background:var(--red);font-weight:900;cursor:pointer}.status{font-size:13px;font-weight:800;margin-top:8px}.save{width:100%;margin-top:14px}.notice{border-left:4px solid var(--yellow);padding-left:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}@media(max-width:760px){.products,.grid{grid-template-columns:1fr}.top{display:block}}
  </style>
</head>
