<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mititoys · Opinión de compra</title>
<meta name="description" content="Compartí tu experiencia de compra verificada en Mititoys.">
<style>:root{--yellow:#ffd21c;--red:#ef2525;--bg:#070707;--card:#121212;--line:#292929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:42px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}.brand{color:var(--yellow);font-size:27px;font-weight:900}.product{display:flex;gap:14px;align-items:center;background:#0c0c0c;border-radius:12px;padding:13px;margin:20px 0}.product img{width:90px;height:90px;object-fit:contain;border-radius:8px;background:#fff}.muted{color:#aaa;line-height:1.55}.stars{display:flex;gap:8px;margin:10px 0 18px}.stars button{border:0;background:none;color:#555;font-size:38px;cursor:pointer;padding:0}.stars button.on{color:var(--yellow)}label{display:grid;gap:7px;margin-top:13px;font-weight:800;font-size:14px}input,textarea{width:100%;padding:12px;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:9px;font:inherit}textarea{min-height:130px;resize:vertical}.send{width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:900;padding:14px;margin-top:18px;cursor:pointer}.send:disabled{opacity:.6}.error{color:#ff7777}.ok{color:#8dea86;font-size:18px;font-weight:800}.back{display:inline-block;color:var(--yellow);text-decoration:none;margin-bottom:16px}</style>
</head>
<body><main class="wrap"><a class="back" href="/">← Volver a Mititoys</a><section class="card"><div class="brand">Mititoys coleccionables</div><h1>Tu opinión verificada</h1><p class="muted">Solo quienes recibieron su compra pueden publicar una reseña. Tu experiencia ayuda a otros coleccionistas.</p><div id="content">Validando tu compra...</div></section></main>
<script>
const token=new URLSearchParams(location.search).get('token')||'',content=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rating=0;
function paint(){document.querySelectorAll('.stars button').forEach((button,index)=>button.classList.toggle('on',index<rating))}
async function load(){try{const r=await fetch('/api/productos?review_token='+encodeURIComponent(token),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Enlace inválido.');const review=j.review;content.innerHTML='<div class="product">'+(review.image?'<img src="'+esc(review.image)+'" alt="">':'')+'<div><b>'+esc(review.product_title)+'</b><br><span class="muted">Pedido '+esc(review.order_number)+'</span></div></div><form id="form"><label>Calificación *</label><div class="stars" aria-label="Calificación de 1 a 5">'+[1,2,3,4,5].map(n=>'<button type="button" data-rating="'+n+'" aria-label="'+n+' estrellas">★</button>').join('')+'</div><label>Título<input id="title" maxlength="120" placeholder="Ej.: Excelente figura"></label><label>Contanos tu experiencia *<textarea id="body" maxlength="2000" required placeholder="¿Qué te gustó del producto y de la compra?"></textarea></label><button id="send" class="send">PUBLICAR OPINIÓN</button><p id="message"></p></form>';document.querySelectorAll('.stars button').forEach(button=>button.onclick=()=>{rating=Number(button.dataset.rating);paint()});document.getElementById('form').onsubmit=submit}catch(e){content.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function submit(event){event.preventDefault();const message=document.getElementById('message'),button=document.getElementById('send');if(!rating){message.className='error';message.textContent='Elegí una calificación de 1 a 5 estrellas.';return}button.disabled=true;message.textContent='Publicando...';try{const r=await fetch('/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,rating,title:document.getElementById('title').value,body:document.getElementById('body').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo publicar.');content.innerHTML='<p class="ok">¡Gracias! Tu opinión verificada ya está publicada.</p><p class="muted">Ayudará a otros coleccionistas a comprar con más confianza.</p>'}catch(e){message.className='error';message.textContent=e.message;button.disabled=false}}
load();
</script></body></html>
