<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Administración</title><style>body{margin:0;font-family:Arial;background:#080808;color:#fff}.wrap{max-width:1200px;margin:auto;padding:30px 18px}h1{color:#ffd21c}.box{background:#121212;border:1px solid #292929;border-radius:14px;padding:20px;margin:18px 0}input,select,button{padding:11px;border-radius:8px;border:1px solid #444;background:#181818;color:#fff}button{background:#ef2525;font-weight:800;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{font-size:25px;font-weight:900}.muted{color:#999}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #292929;text-align:left;white-space:nowrap}th{color:#ffd21c}.ok{color:#6cff75}.pending{color:#ffd21c}.bad{color:#ff6b6b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Mititoys · Panel de administración</h1><div id="login" class="box"><h2>Acceso privado</h2><p class="muted">Ingresá la contraseña de administrador.</p><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"> <button onclick="login()">ENTRAR</button><p id="loginError" class="bad"></p></div><div id="app" class="hidden"><div class="grid"><div class="box"><div class="muted">Pedidos</div><div id="ordersCount" class="stat">0</div></div><div class="box"><div class="muted">Clientes</div><div id="customersCount" class="stat">0</div></div><div class="box"><div class="muted">Ventas registradas</div><div id="salesTotal" class="stat">$0</div></div></div><div class="box"><button onclick="loadData()">↻ ACTUALIZAR</button> <button onclick="logout()">SALIR</button><p id="dataError" class="bad"></p></div><div class="box"><h2>Pedidos</h2><div class="table"><table><thead><tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Importe</th><th>Pago</th><th>Estado</th><th>Envío</th><th>Tracking</th><th>Acción</th></tr></thead><tbody id="orders"></tbody></table></div></div><div class="box"><h2>Clientes</h2><div class="table"><table><thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Ciudad</th><th>Pedidos</th><th>Total comprado</th></tr></thead><tbody id="customers"></tbody></table></div></div></div></div><script>let data={orders:[],customers:[]};const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function login(){const password=document.getElementById('password').value;document.getElementById('loginError').textContent='';try{const r=await fetch('/api/admin-auth?cb='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok){document.getElementById('loginError').textContent=r.status===401?'Contraseña incorrecta.':'No se pudo iniciar sesión ('+r.status+').';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadData()}catch(e){document.getElementById('loginError').textContent='Error de conexión.'}}async function loadData(){document.getElementById('dataError').textContent='';try{const r=await fetch('/api/admin?cb='+Date.now(),{cache:'no-store'});const json=await r.json().catch(()=>({}));if(r.status===401){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return}if(!r.ok){document.getElementById('dataError').textContent='Error al cargar pedidos: '+(json.error||r.status);return}if(!Array.isArray(json.orders)||!Array.isArray(json.customers)){document.getElementById('dataError').textContent='La API devolvió un formato inesperado.';return}data=json;render()}catch(e){document.getElementById('dataError').textContent='No se pudo conectar con el servidor.'}}function render(){document.getElementById('ordersCount').textContent=data.orders.length;document.getElementById('customersCount').textContent=data.customers.length;document.getElementById('salesTotal').textContent=money(data.orders.filter(o=>o.status!=='cancelled'&&o.status!=='refunded').reduce((a,o)=>a+Number(o.total_amount||0),0));document.getElementById('orders').innerHTML=data.orders.map(o=>`<tr><td><b>${esc(o.order_number)}</b></td><td>${new Date(o.created_at).toLocaleString('es-AR')}</td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.customer_email)}</span></td><td>${esc(o.product_title)}</td><td>${money(o.total_amount)}</td><td>${esc(o.payment_status||'pendiente')}<br><span class="muted">${esc(o.payment_id||'')}</span></td><td><select id="s-${o.id}">${['pending','approved','processing','shipped','delivered','cancelled','refunded'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${esc(o.shipping_status)}</td><td><input id="t-${o.id}" value="${esc(o.tracking_number||'')}" placeholder="Tracking"></td><td><button onclick="save(${o.id})">GUARDAR</button></td></tr>`).join('');document.getElementById('customers').innerHTML=data.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${esc(c.city)}</td><td>${c.orders_count}</td><td>${money(c.total_spent)}</td></tr>`).join('')}async function save(id){const status=document.getElementById('s-'+id).value;const tracking=document.getElementById('t-'+id).value;const r=await fetch('/api/admin',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status,tracking_number:tracking})});if(!r.ok){alert('No se pudo actualizar el pedido.');return}await loadData()}async function logout(){await fetch('/api/admin-auth',{method:'DELETE'});location.reload()}loadData()</script></body></html>
