<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Carrito</title><style>:root{--red:#ef2525;--yellow:#ffd21c;--bg:#070707;--card:#121212;--line:#292929;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:32px 18px}.back{color:var(--yellow);text-decoration:none}.brand{color:var(--yellow);font-size:28px;font-weight:900;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px}.item{display:grid;grid-template-columns:88px 1fr auto;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.item img{width:88px;height:88px;object-fit:contain;background:#0b0b0b;border-radius:10px}.item h3{margin:0 0 7px;font-size:17px}.muted{color:var(--muted)}.price{color:var(--yellow);font-weight:900}.controls{display:flex;align-items:center;gap:8px;margin-top:10px}.qty{width:55px;text-align:center}.qty button{width:30px;height:30px;border:1px solid #444;background:#242424;color:#fff;border-radius:6px;cursor:pointer}.qty input{width:52px;padding:7px;border:1px solid #444;background:#0d0d0d;color:#fff;border-radius:6px;text-align:center}.remove{border:0;background:#242424;color:#fff;padding:8px 10px;border-radius:7px;cursor:pointer}.summary{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:20px;font-size:25px;font-weight:900}.btn{display:block;width:100%;box-sizing:border-box;text-align:center;padding:14px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:900;margin-top:18px;cursor:pointer;text-decoration:none}.btn.secondary{background:#242424}.empty{text-align:center;padding:20px}.error{color:#ff6b6b;margin-top:12px}@media(max-width:650px){.item{grid-template-columns:70px 1fr}.item img{width:70px;height:70px}.item>div:last-child{grid-column:2}.summary{font-size:21px}}</style></head><body><div class="wrap"><a class="back" href="/">← Volver a la tienda</a><p class="brand">Mititoys coleccionables</p><h1>🛒 Tu carrito</h1><div class="card" id="cart">Cargando carrito...</div></div><script src="/carrito.js?v=1"></script><script>const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));let products=[];const cartEl=document.getElementById('cart');async function load(){try{const r=await fetch('/api/productos?cb='+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo cargar el catálogo.');products=Array.isArray(j.products)?j.products:[];render()}catch(e){cartEl.innerHTML='<p class="error">No se pudo cargar el carrito. Actualizá la página e intentá nuevamente.</p>'}}function render(){const cart=window.MitiToysCart.get();if(!cart.length){cartEl.innerHTML='<div class="empty"><p class="muted">Tu carrito está vacío.</p><a class="btn secondary" href="/#catalogo">VER FIGURAS</a></div>';return}const valid=cart.filter(x=>products.some(p=>String(p.id)===String(x.id)));if(valid.length!==cart.length){valid.forEach(x=>window.MitiToysCart.add(x.id,0));}let total=0,units=0;cartEl.innerHTML=cart.map(x=>{const p=products.find(y=>String(y.id)===String(x.id));if(!p)return '';const q=Math.max(1,Math.floor(Number(x.qty)||1));const line=Number(p.price||0)*q;total+=line;units+=q;const img=(Array.isArray(p.images)&&p.images[0])||'';return `<div class="item"><img src="${String(img).replace(/\"/g,'&quot;')}" alt=""><div><h3>${escapeHtml(p.title)}</h3><div class="muted">COD ${escapeHtml(p.id)} · ${money(p.price)} c/u</div><div class="controls"><div class="qty"><button type="button" onclick="changeQty('${escapeJs(p.id)}',-1)">−</button> <input type="number" min="1" value="${q}" onchange="setQty('${escapeJs(p.id)}',this.value)"> <button type="button" onclick="changeQty('${escapeJs(p.id)}',1)">+</button></div><button class="remove" type="button" onclick="removeItem('${escapeJs(p.id)}')">Quitar</button></div></div><div><div class="price">${money(line)}</div></div></div>`}).join('')+`<div class="summary"><span>${units} ${units===1?'unidad':'unidades'}</span><span>${money(total)}</span></div><button class="btn" type="button" onclick="goCheckout()">CONTINUAR AL CHECKOUT</button><a class="btn secondary" href="/#catalogo">SEGUIR COMPRANDO</a><p id="error" class="error"></p>`}function escapeHtml(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function escapeJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function changeQty(id,d){const current=window.MitiToysCart.get().find(x=>x.id===String(id));window.MitiToysCart.setQty(id,Math.max(1,(current?.qty||1)+d));render()}function setQty(id,v){window.MitiToysCart.setQty(id,Math.max(1,Math.floor(Number(v)||1)));render()}function removeItem(id){window.MitiToysCart.remove(id);render()}function goCheckout(){if(!window.MitiToysCart.get().length)return;location.href='/checkout.html?cart=1'}load();</script></body></html>
