<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Carrito</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:35px 18px}.brand{color:#ffd21c;font-size:28px;font-weight:900}.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:22px;margin-top:18px}.item{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #292929}.muted{color:#aaa}.price{color:#ffd21c;font-weight:900}.btn{display:block;width:100%;box-sizing:border-box;text-align:center;padding:14px;border:0;border-radius:9px;background:#ef2525;color:#fff;font-weight:900;margin-top:18px;cursor:pointer}.remove{background:#242424;color:#fff;border:0;padding:8px;border-radius:7px}.total{font-size:24px;font-weight:900;text-align:right;margin-top:18px}a{color:#ffd21c}</style></head><body><div class="wrap"><a href="/">← Volver a la tienda</a><p class="brand">Mititoys coleccionables</p><h1>Tu carrito</h1><div class="card" id="cart"></div></div><script>const products={3377:{title:'Figura Luffy Gear 5 – Nika – One Piece – 31 cm',price:150000},3375:{title:'Figura One Piece Kaido Dragón 30 Cm PVC Coleccionable Anime',price:300000}};const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);let cart=JSON.parse(localStorage.getItem('mititoys_cart')||'[]');function save(){localStorage.setItem('mititoys_cart',JSON.stringify(cart));render()}function render(){const el=document.getElementById('cart');if(!cart.length){el.innerHTML='<p class="muted">Tu carrito está vacío.</p><a href="/">Ver figuras</a>';return}let total=0;el.innerHTML=cart.map((x,i)=>{const p=products[x.id];const q=Math.max(1,Number(x.qty)||1);total+=p.price*q;return `<div class="item"><div><b>${p.title}</b><br><span class="muted">Cantidad: ${q}</span></div><div><div class="price">${money(p.price*q)}</div><button class="remove" onclick="cart.splice(${i},1);save()">Quitar</button></div></div>`}).join('')+`<div class="total">Total: ${money(total)}</div><button class="btn" onclick="checkout()">CONTINUAR CON LA COMPRA</button>`}function checkout(){if(cart.length!==1){alert('El checkout actual procesa una figura por pedido. Para mantener el stock y el pago seguros, comprá cada producto por separado por ahora.');return}location.href='/checkout.html?productId='+encodeURIComponent(cart[0].id)}render();</script></body></html>
