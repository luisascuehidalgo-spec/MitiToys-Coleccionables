<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Seguimiento de pedido</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:650px;margin:auto;padding:60px 18px}.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:28px}.brand{color:#ffd21c;font-size:28px;font-weight:900}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #444;background:#0c0c0c;color:#fff;margin-top:10px}button{background:#ef2525;border:0;font-weight:900;cursor:pointer}.error{color:#ff6b6b}.muted{color:#aaa}.result{margin-top:20px;background:#191919;border-radius:12px;padding:18px;line-height:1.7}.status{color:#ffd21c;font-size:20px;font-weight:900}.back{color:#ffd21c;display:inline-block;margin-bottom:18px}</style></head><body><div class="wrap"><a class="back" href="/">← Volver a Mititoys</a><div class="card"><div class="brand">Mititoys coleccionables</div><h1>Seguimiento de pedido</h1><p class="muted">Ingresá tu número de pedido para consultar el estado de pago y envío.</p><form id="f"><input id="n" required placeholder="Ej.: MT-202609021230001-ABC123"><button>CONSULTAR PEDIDO</button></form><div id="out"></div></div></div><script>const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));const f=document.getElementById('f');f.addEventListener('submit',async e=>{e.preventDefault();const n=document.getElementById('n').value.trim();const out=document.getElementById('out');out.innerHTML='<p class="muted">Consultando...</p>';try{const r=await fetch('/api/estado-pedido?pedido='+encodeURIComponent(n),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se encontró el pedido.');const o=j.order;out.innerHTML=`<div class="result"><div class="status">${o.status==='approved'?'✅ Pago aprobado':o.status==='shipped'?'🚚 Pedido despachado':o.status==='delivered'?'🎉 Pedido entregado':o.status==='cancelled'?'❌ Pedido cancelado':'🕐 '+o.status}</div><hr><b>Pedido:</b> ${o.order_number}<br><b>Producto:</b> ${o.product_title}<br><b>Cantidad:</b> ${o.quantity}<br><b>Total:</b> ${money(o.total_amount)}<br><b>Pago:</b> ${o.payment_status||'pendiente'}<br><b>Envío:</b> ${o.shipping_status||'sin preparar'}<br>${o.shipping_carrier?'<b>Transportista:</b> '+o.shipping_carrier+'<br>':''}${o.tracking_number?'<b>Tracking:</b> '+o.tracking_number+'<br>':''}<small class="muted">Última actualización: ${new Date(o.updated_at).toLocaleString('es-AR')}</small></div>`}catch(err){out.innerHTML='<p class="error">'+err.message+'</p>'}});</script></body></html>
