<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Seguimiento de pedido</title><meta name="description" content="Consultá de forma segura el estado de tu pedido en Mititoys coleccionables."><style>:root{--yellow:#ffd21c;--red:#ef2525;--bg:#070707;--card:#121212;--line:#292929;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:52px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 20px 55px rgba(0,0,0,.28)}.brand{color:var(--yellow);font-size:29px;font-weight:900}.lead{color:#ccc;line-height:1.6}.fields{display:grid;gap:12px;margin-top:22px}label{font-size:13px;font-weight:800;color:#ddd}input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#0c0c0c;color:#fff;margin-top:7px;font-size:15px}button{width:100%;padding:14px;border-radius:9px;border:0;background:var(--red);color:#fff;font-weight:900;cursor:pointer;margin-top:5px}.error{color:#ff7c7c}.muted{color:var(--muted)}.result{margin-top:22px;background:#191919;border:1px solid #2d2d2d;border-radius:13px;padding:20px;line-height:1.65}.status{color:var(--yellow);font-size:20px;font-weight:900;margin-bottom:12px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #2a2a2a}.item:last-child{border-bottom:0}.back{color:var(--yellow);display:inline-block;margin-bottom:18px;text-decoration:none}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.trust div{background:#0d0d0d;border:1px solid #252525;border-radius:9px;padding:11px;text-align:center;font-size:12px;color:#ccc}.links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:22px}.links a{color:#bbb;text-decoration:none;font-size:13px}@media(max-width:580px){.card{padding:22px}.trust{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="/">← Volver a Mititoys</a><div class="card"><div class="brand">Mititoys coleccionables</div><h1>Seguimiento de pedido</h1><p class="lead">Ingresá el número de pedido y el mismo email que usaste al comprar. Así protegemos los datos de tu compra.</p><form id="f" class="fields"><label>Número de pedido<input id="n" required autocomplete="off" placeholder="Ej.: MT-202609021230001-ABC123"></label><label>Email de la compra<input id="email" type="email" required autocomplete="email" placeholder="tu@email.com"></label><button>CONSULTAR PEDIDO</button></form><div class="trust"><div>🔒 Consulta privada</div><div>📦 Estado de envío</div><div>💳 Estado del pago</div></div><div id="out"></div><div class="links"><a href="/preguntas.html">Preguntas frecuentes</a><a href="/politicas.html">Políticas de compra</a><a target="_blank" rel="noopener" href="https://wa.me/541133466187">Ayuda por WhatsApp</a></div></div></div><script>const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const f=document.getElementById('f');const qp=new URLSearchParams(location.search);if(qp.get('pedido'))document.getElementById('n').value=qp.get('pedido');f.addEventListener('submit',async e=>{e.preventDefault();const n=document.getElementById('n').value.trim();const email=document.getElementById('email').value.trim().toLowerCase();const out=document.getElementById('out');out.innerHTML='<p class="muted">Consultando...</p>';try{const r=await fetch('/api/estado-pedido?pedido='+encodeURIComponent(n)+'&email='+encodeURIComponent(email),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se encontró el pedido.');localStorage.setItem('mititoys_last_order_email',email);const o=j.order;const shipLabels={not_shipped:'Pendiente de preparación',preparing:'Preparando el paquete',in_transit:'En camino',delivered:'Entregado',exception:'El correo informó una novedad'};const labels={approved:'✅ Pago aprobado',processing:'📦 Pedido en preparación',shipped:'🚚 Pedido despachado',delivered:'🎉 Pedido entregado',cancelled:'❌ Pedido cancelado',refunded:'↩️ Pago reembolsado',pending:'🕐 Pago pendiente'};const items=Array.isArray(o.items)&&o.items.length?o.items.map(i=>`<div class="item"><span>${esc(i.product_title)} × ${Number(i.quantity||0)}</span><b>${money(i.total_amount)}</b></div>`).join(''):`<div class="item"><span>${esc(o.product_title)}</span><b>${money(o.total_amount)}</b></div>`;out.innerHTML=`<div class="result"><div class="status">${labels[o.status]||'🕐 '+esc(o.status)}</div><b>Pedido:</b> ${esc(o.order_number)}<br><b>Total:</b> ${money(o.total_amount)}<br><b>Pago:</b> ${esc(o.payment_status||'pendiente')}<br><b>Envío:</b> ${esc(shipLabels[o.shipping_status]||o.shipping_status||'pendiente de preparación')}<div style="margin-top:12px">${items}</div>${o.shipping_carrier?'<p><b>Transportista:</b> '+esc(o.shipping_carrier)+'</p>':''}${o.shipping_destination_type==='branch'?'<p><b>Sucursal:</b> '+esc(o.shipping_branch_name||'')+' · '+esc(o.shipping_branch_address||'')+'</p>':''}${o.tracking_number?'<p><b>Tracking:</b> '+esc(o.tracking_number)+'</p>':''}${Array.isArray(o.tracking_events)&&o.tracking_events.length?'<div style="margin-top:12px"><b>Movimientos del envío</b>'+o.tracking_events.map(e=>'<div class="item"><span>'+esc(e.message)+'</span><small class="muted">'+esc(e.date||'')+'</small></div>').join('')+'</div>':''}<small class="muted">Última actualización: ${new Date(o.updated_at).toLocaleString('es-AR')}</small></div>`}catch(err){out.innerHTML='<p class="error">'+esc(err.message)+'</p>'}});</script></body></html>
