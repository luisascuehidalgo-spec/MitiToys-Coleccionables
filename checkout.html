<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Checkout</title><style>:root{--red:#ef2525;--yellow:#ffd21c;--bg:#070707;--card:#121212;--line:#292929;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:820px;margin:auto;padding:32px 18px}.back{display:inline-block;margin-bottom:18px;color:var(--yellow);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:25px}.brand{color:var(--yellow);font-size:28px;font-weight:900}.summary{background:#191919;border-radius:10px;padding:15px;margin:20px 0}.summary-item{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #292929}.summary-item:last-child{border-bottom:0}.summary-item small{color:#999}.total{display:flex;justify-content:space-between;margin-top:14px;font-size:23px;font-weight:900;color:var(--yellow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;color:#ccc;font-size:14px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #444;background:#0d0d0d;color:#fff}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.btn{width:100%;padding:14px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.6}.error{color:#ff6b6b;margin-top:12px}.hint{color:#999;line-height:1.5}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><a class="back" href="/carrito.html">← Volver al carrito</a><div class="card"><div class="brand">Mititoys coleccionables</div><h1>Finalizar compra</h1><p class="hint">Completá tus datos. Tu carrito completo se enviará en un único pedido a Mercado Pago.</p><div id="summary" class="summary">Cargando productos...</div><form id="form"><div class="grid"><label>Nombre y apellido *<input id="name" required maxlength="120" autocomplete="name"></label><label>Email *<input id="email" type="email" required maxlength="160" autocomplete="email"></label><label>Teléfono *<input id="phone" required maxlength="50" autocomplete="tel"></label><label>Ciudad *<input id="city" required maxlength="100" autocomplete="address-level2"></label><label class="full">Dirección de entrega *<input id="address" required maxlength="200" autocomplete="street-address"></label><label>Código postal *<input id="postal" required maxlength="20" autocomplete="postal-code"></label><label class="full">Indicaciones para la entrega<textarea id="notes" maxlength="1000" placeholder="Piso, departamento, horario u otra indicación"></textarea></label></div><button id="submit" class="btn">CONTINUAR A MERCADO PAGO</button><div id="error" class="error"></div></form></div></div><script src="/carrito.js?v=1"></script><script>const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n||0));const cart=window.MitiToysCart.get();const summary=document.getElementById('summary');let products=[];function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function load(){if(!cart.length){summary.innerHTML='<b>Tu carrito está vacío.</b><br><a href="/carrito.html">Volver al carrito</a>';document.getElementById('form').remove();return}try{const r=await fetch('/api/productos?cb='+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo cargar el catálogo.');products=Array.isArray(j.products)?j.products:[];const items=cart.map(x=>{const p=products.find(y=>String(y.id)===String(x.id));return p?{id:String(p.id),title:p.title,qty:Math.max(1,Math.floor(Number(x.qty)||1)),unit_price:Number(p.price||0)}:null}).filter(Boolean);if(items.length!==cart.length)throw new Error('Uno de los productos del carrito ya no está disponible. Volvé al carrito y revisalo.');const total=items.reduce((s,x)=>s+x.unit_price*x.qty,0);summary.innerHTML=items.map(x=>`<div class="summary-item"><div><b>${esc(x.title)}</b><br><small>COD ${esc(x.id)} · ${x.qty} ${x.qty===1?'unidad':'unidades'}</small></div><strong>${money(x.unit_price*x.qty)}</strong></div>`).join('')+`<div class="total"><span>Total</span><span>${money(total)}</span></div>`}catch(e){summary.innerHTML='<p class="error">'+esc(e.message||'No se pudo cargar el pedido.')+'</p>';document.getElementById('form')?.remove()}}document.getElementById('form')?.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),error=document.getElementById('error');error.textContent='';btn.disabled=true;btn.textContent='⏳ PREPARANDO PEDIDO...';const customer={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),city:document.getElementById('city').value.trim(),postal_code:document.getElementById('postal').value.trim(),notes:document.getElementById('notes').value.trim()};try{const r=await fetch('/api/crear-preferencia-carrito',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart,customer})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.init_point)throw new Error(j.error||'No se pudo preparar la compra.');window.MitiToysCart.clear();location.href=j.init_point}catch(err){error.textContent=err.message||'No se pudo iniciar el pago.';btn.disabled=false;btn.textContent='CONTINUAR A MERCADO PAGO'}});load();</script></body></html>
