<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Datos de compra</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:35px 18px}.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:25px}.brand{color:#ffd21c;font-size:28px;font-weight:900}.summary{background:#191919;border-radius:10px;padding:15px;margin:20px 0}.summary b{color:#ffd21c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;color:#ccc;font-size:14px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #444;background:#0d0d0d;color:#fff}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.btn{width:100%;padding:14px;border:0;border-radius:9px;background:#ef2525;color:#fff;font-weight:900;font-size:16px;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.6}.error{color:#ff6b6b;margin-top:12px}.back{display:inline-block;margin-bottom:18px;color:#ffd21c}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><a class="back" href="/">← Volver a la tienda</a><div class="card"><div class="brand">Mititoys coleccionables</div><h1>Finalizar compra</h1><p style="color:#aaa">Completá tus datos para preparar correctamente el pedido y el envío. Después continuarás a Mercado Pago.</p><div id="summary" class="summary">Cargando producto...</div><form id="form"><div class="grid"><label>Nombre y apellido *<input id="name" required maxlength="120" autocomplete="name"></label><label>Email *<input id="email" type="email" required maxlength="160" autocomplete="email"></label><label>Teléfono *<input id="phone" required maxlength="50" autocomplete="tel"></label><label>Ciudad *<input id="city" required maxlength="100" autocomplete="address-level2"></label><label class="full">Dirección de entrega *<input id="address" required maxlength="200" autocomplete="street-address"></label><label>Código postal *<input id="postal" required maxlength="20" autocomplete="postal-code"></label><label class="full">Indicaciones para la entrega<textarea id="notes" maxlength="1000" placeholder="Piso, departamento, horario u otra indicación"></textarea></label></div><button id="submit" class="btn">CONTINUAR A MERCADO PAGO</button><div id="error" class="error"></div></form></div></div><script>const products={3377:{title:'Figura Luffy Gear 5 – Nika – One Piece – 31 cm',price:150000},3375:{title:'Figura One Piece Kaido Dragón 30 Cm PVC Coleccionable Anime',price:300000}};const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);const id=new URLSearchParams(location.search).get('productId');const p=products[id];const summary=document.getElementById('summary');if(!p){summary.innerHTML='<b>Producto no válido.</b>';document.getElementById('form').remove()}else summary.innerHTML=`<b>${p.title}</b><br><span style="font-size:22px;font-weight:900">${money(p.price)}</span>`;document.getElementById('form')?.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');const error=document.getElementById('error');error.textContent='';btn.disabled=true;btn.textContent='⏳ PREPARANDO PEDIDO...';const customer={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),city:document.getElementById('city').value.trim(),postal_code:document.getElementById('postal').value.trim(),notes:document.getElementById('notes').value.trim()};try{const r=await fetch('/api/crear-preferencia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id,customer})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.init_point)throw new Error(j.error||'No se pudo preparar la compra.');location.href=j.init_point}catch(err){error.textContent=err.message||'No se pudo iniciar el pago.';btn.disabled=false;btn.textContent='CONTINUAR A MERCADO PAGO'}});</script></body></html>
