name: Apply fulfillment race integrity fix
on:
  push:
    branches: [fix/fulfillment-race-integrity-20260907]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fulfillment-race-integrity-20260907
      - name: Patch admin and Enviopack race handling
        shell: python
        run: |
          from pathlib import Path

          p = Path('api/admin.js')
          s = p.read_text()
          s = s.replace(
            "const { releaseReservedStock } = require('../lib/inventory');",
            "const { releaseReservedStockIfUnshipped } = require('../lib/inventory');",
            1
          )
          s = s.replace(
            "const { adminStatusError } = require('../lib/order-state');",
            "const { adminStatusError, orderStatusFromShipping } = require('../lib/order-state');",
            1
          )
          s = s.replace(
            "async function createShipment(sql, id) {\n  let order = await loadFulfillmentOrder(sql, id);",
            "async function createShipment(sql, id) {\n  let providerShipmentCreated = false;\n  let order = await loadFulfillmentOrder(sql, id);",
            1
          )
          old_claim = """    UPDATE orders SET shipping_generation_status='processing',shipping_last_error=NULL,updated_at=NOW()\n    WHERE id=${id} AND enviopack_shipment_id IS NULL AND shipping_generation_status IN ('not_created','failed')\n    RETURNING id\n  `;\n  if (!claim.length) throw Object.assign(new Error('El envío ya se está generando. Actualizá el panel en unos segundos.'), { status: 409 });"""
          new_claim = """    UPDATE orders SET shipping_generation_status='processing',shipping_last_error=NULL,updated_at=NOW()\n    WHERE id=${id} AND payment_status='approved' AND enviopack_shipment_id IS NULL AND shipping_generation_status IN ('not_created','failed')\n    RETURNING id\n  `;\n  if (!claim.length) throw Object.assign(new Error('El envío ya se está generando o el pago dejó de estar aprobado. Actualizá el panel antes de reintentar.'), { status: 409 });"""
          if old_claim not in s:
            raise SystemExit('admin claim block not found')
          s = s.replace(old_claim, new_claim, 1)

          old_provider = """    const items = await sql`SELECT product_id,product_title,quantity FROM order_items WHERE order_id=${id} ORDER BY id`;\n    const packages = await packagesForOrder(sql, order);\n    const providerOrderId = order.enviopack_order_id || await getOrCreateEnviopackOrder({"""
          new_provider = """    const items = await sql`SELECT product_id,product_title,quantity FROM order_items WHERE order_id=${id} ORDER BY id`;\n    const packages = await packagesForOrder(sql, order);\n    const firstPaymentGuard = await sql`SELECT payment_status FROM orders WHERE id=${id} LIMIT 1`;\n    if (!firstPaymentGuard.length || firstPaymentGuard[0].payment_status !== 'approved') {\n      throw Object.assign(new Error('Mercado Pago cambió el estado del pago antes de iniciar el despacho.'), { status: 409, code: 'PAYMENT_CHANGED_DURING_SHIPMENT' });\n    }\n    const providerOrderId = order.enviopack_order_id || await getOrCreateEnviopackOrder({"""
          if old_provider not in s:
            raise SystemExit('provider order block not found')
          s = s.replace(old_provider, new_provider, 1)

          old_confirm = """    await sql`UPDATE orders SET enviopack_order_id=${providerOrderId},updated_at=NOW() WHERE id=${id}`;\n\n    const shipment = await createConfirmedShipment({"""
          new_confirm = """    await sql`UPDATE orders SET enviopack_order_id=${providerOrderId},updated_at=NOW() WHERE id=${id}`;\n    const secondPaymentGuard = await sql`SELECT payment_status FROM orders WHERE id=${id} LIMIT 1`;\n    if (!secondPaymentGuard.length || secondPaymentGuard[0].payment_status !== 'approved') {\n      throw Object.assign(new Error('Mercado Pago cambió el estado del pago antes de confirmar el despacho.'), { status: 409, code: 'PAYMENT_CHANGED_DURING_SHIPMENT' });\n    }\n\n    const shipment = await createConfirmedShipment({"""
          if old_confirm not in s:
            raise SystemExit('shipment confirmation block not found')
          s = s.replace(old_confirm, new_confirm, 1)

          old_final = """    const shipmentId = String(shipment.id);\n    const providerShipmentState = String(shipment.estado || '');\n    const trackingNumber = clean(shipment.tracking_number || shipment.numero_tracking, 120) || null;\n    const labelReady = providerShipmentState.toUpperCase() === 'P';\n    await sql`\n      UPDATE orders SET\n        enviopack_shipment_id=${shipmentId},enviopack_state=${providerShipmentState || null},\n        shipping_destination_type=${order.shipping_destination_type},\n        shipping_street=${order.shipping_street || null},shipping_number=${order.shipping_number || null},\n        shipping_branch_id=${order.shipping_branch_id || null},shipping_branch_name=${order.shipping_branch_name || null},\n        shipping_branch_address=${order.shipping_branch_address || null},\n        tracking_number=${trackingNumber},shipping_label_ready=${labelReady},\n        shipping_generation_status='created',shipping_status='preparing',status='processing',\n        shipping_created_at=NOW(),shipping_last_synced_at=NOW(),shipping_last_error=NULL,updated_at=NOW()\n      WHERE id=${id}\n    `;\n    await sql`INSERT INTO order_events(order_id,event_type,new_status,payload) VALUES(${id},'enviopack.shipment_created','processing',${JSON.stringify({ provider_order_id: providerOrderId, shipment_id: shipmentId, provider_state: providerShipmentState, tracking_number: trackingNumber })}::jsonb)`;\n    if (trackingNumber) await queueAndSendOrderNotification(sql, id, 'shipment_created');\n    return { reused: false, shipment_id: shipmentId, tracking_number: trackingNumber, label_ready: labelReady };\n  } catch (error) {\n    await sql`UPDATE orders SET shipping_generation_status='failed',shipping_last_error=${clean(error.message, 1000)},updated_at=NOW() WHERE id=${id}`;\n    throw error;\n  }"""
          new_final = """    providerShipmentCreated = true;\n    const shipmentId = String(shipment.id);\n    const providerShipmentState = String(shipment.estado || '');\n    const trackingNumber = clean(shipment.tracking_number || shipment.numero_tracking, 120) || null;\n    const labelReady = providerShipmentState.toUpperCase() === 'P';\n    const currentRows = await sql`SELECT status,payment_status FROM orders WHERE id=${id} LIMIT 1`;\n    const currentOrder = currentRows[0] || { status: 'pending', payment_status: null };\n    const finalOrderStatus = orderStatusFromShipping(currentOrder, 'processing');\n    const updated = await sql`\n      UPDATE orders SET\n        enviopack_shipment_id=${shipmentId},enviopack_state=${providerShipmentState || null},\n        shipping_destination_type=${order.shipping_destination_type},\n        shipping_street=${order.shipping_street || null},shipping_number=${order.shipping_number || null},\n        shipping_branch_id=${order.shipping_branch_id || null},shipping_branch_name=${order.shipping_branch_name || null},\n        shipping_branch_address=${order.shipping_branch_address || null},\n        tracking_number=${trackingNumber},shipping_label_ready=${labelReady},\n        shipping_generation_status='created',shipping_status='preparing',status=${finalOrderStatus},\n        shipping_created_at=NOW(),shipping_last_synced_at=NOW(),shipping_last_error=NULL,updated_at=NOW()\n      WHERE id=${id}\n      RETURNING status,payment_status\n    `;\n    await sql`INSERT INTO order_events(order_id,event_type,new_status,payload) VALUES(${id},'enviopack.shipment_created',${finalOrderStatus},${JSON.stringify({ provider_order_id: providerOrderId, shipment_id: shipmentId, provider_state: providerShipmentState, tracking_number: trackingNumber })}::jsonb)`;\n    if (trackingNumber && updated[0]?.payment_status === 'approved') await queueAndSendOrderNotification(sql, id, 'shipment_created');\n    return { reused: false, shipment_id: shipmentId, tracking_number: trackingNumber, label_ready: labelReady, order_status: finalOrderStatus };\n  } catch (error) {\n    await sql`UPDATE orders SET shipping_generation_status='failed',shipping_last_error=${clean(error.message, 1000)},updated_at=NOW() WHERE id=${id}`;\n    if (!providerShipmentCreated && error?.code === 'PAYMENT_CHANGED_DURING_SHIPMENT') {\n      try {\n        const paymentRows = await sql`SELECT payment_status FROM orders WHERE id=${id} LIMIT 1`;\n        const paymentStatus = String(paymentRows[0]?.payment_status || '');\n        if (['cancelled','rejected','refunded','charged_back'].includes(paymentStatus)) {\n          const stockRelease = await releaseReservedStockIfUnshipped(sql, id, 'Liberación tras abortar generación de envío por cambio de pago');\n          await sql`INSERT INTO order_events(order_id,event_type,new_status,payload) VALUES(${id},'enviopack.generation_aborted',${orderStatusFromShipping({status:order.status,payment_status:paymentStatus},order.status)},${JSON.stringify({ reason: 'payment_changed', stock_release: stockRelease })}::jsonb)`;\n        }\n      } catch (releaseError) {\n        console.warn('shipment abort stock release failed:', 'code=' + String(releaseError?.code || releaseError?.name || 'RELEASE_ERROR'));\n      }\n    }\n    throw error;\n  }"""
          if old_final not in s:
            raise SystemExit('admin final shipment block not found')
          s = s.replace(old_final, new_final, 1)

          old_sync_state = "const state = providerState(details, tracking);\n  const labelReady = String(details?.estado || '').toUpperCase() === 'P';"
          new_sync_state = "const state = providerState(details, tracking);\n  state.order = orderStatusFromShipping(order, state.order);\n  const labelReady = String(details?.estado || '').toUpperCase() === 'P';"
          if old_sync_state not in s:
            raise SystemExit('admin sync state block not found')
          s = s.replace(old_sync_state, new_sync_state, 1)
          s = s.replace(
            "if (trackingNumber && trackingNumber !== order.tracking_number) await queueAndSendOrderNotification(sql, id, 'shipment_created');",
            "if (trackingNumber && trackingNumber !== order.tracking_number && order.payment_status === 'approved') await queueAndSendOrderNotification(sql, id, 'shipment_created');",
            1
          )

          old_release = """      if(previous.status!==status && (status==='cancelled'||status==='refunded')) {\n        await releaseReservedStock(sql,id,status==='refunded'?'Liberación por reembolso confirmado':'Liberación por cancelación confirmada');\n      }\n      if(previous.status!==status){\n        await sql`INSERT INTO order_events(order_id,event_type,old_status,new_status,payload) VALUES(${id},'admin.status_changed',${previous.status},${status},${JSON.stringify({tracking_number:tracking,shipping_carrier:carrier})}::jsonb)`;"""
          new_release = """      let stockRelease=null;\n      if(previous.status!==status && (status==='cancelled'||status==='refunded')) {\n        stockRelease=await releaseReservedStockIfUnshipped(sql,id,status==='refunded'?'Liberación por reembolso confirmado':'Liberación por cancelación confirmada');\n      }\n      if(previous.status!==status){\n        await sql`INSERT INTO order_events(order_id,event_type,old_status,new_status,payload) VALUES(${id},'admin.status_changed',${previous.status},${status},${JSON.stringify({tracking_number:tracking,shipping_carrier:carrier,stock_release:stockRelease})}::jsonb)`;"""
          if old_release not in s:
            raise SystemExit('admin release block not found')
          s = s.replace(old_release, new_release, 1)
          p.write_text(s)

          p = Path('api/envios.js')
          s = p.read_text()
          s = s.replace(
            "const { releaseReservedStock } = require('../lib/inventory');\n",
            "const { releaseReservedStock } = require('../lib/inventory');\nconst { orderStatusFromShipping } = require('../lib/order-state');\n",
            1
          )
          old_select = "const orders = await sql`SELECT id,tracking_number,status FROM orders WHERE enviopack_shipment_id=${String(shipmentId)} LIMIT 1`;"
          new_select = "const orders = await sql`SELECT id,tracking_number,status,payment_status FROM orders WHERE enviopack_shipment_id=${String(shipmentId)} LIMIT 1`;"
          if old_select not in s:
            raise SystemExit('envios shipment select not found')
          s = s.replace(old_select, new_select, 1)
          old_state = "const state = shipmentState(details, tracking);\n  const labelReady = String(details?.estado || '').toUpperCase() === 'P';"
          new_state = "const state = shipmentState(details, tracking);\n  state.order = orderStatusFromShipping(orders[0], state.order);\n  const labelReady = String(details?.estado || '').toUpperCase() === 'P';"
          if old_state not in s:
            raise SystemExit('envios shipment state block not found')
          s = s.replace(old_state, new_state, 1)
          s = s.replace(
            "if (trackingNumber && trackingNumber !== orders[0].tracking_number) await queueAndSendOrderNotification(sql, orders[0].id, 'shipment_created');",
            "if (trackingNumber && trackingNumber !== orders[0].tracking_number && orders[0].payment_status === 'approved') await queueAndSendOrderNotification(sql, orders[0].id, 'shipment_created');",
            1
          )
          p.write_text(s)
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-fulfillment-race-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin.js api/envios.js .github/workflows/apply-fulfillment-race-fix-temp.yml
          git commit -m "Protect fulfillment against payment races"
          git push origin HEAD:fix/fulfillment-race-integrity-20260907
