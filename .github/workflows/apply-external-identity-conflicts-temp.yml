name: Apply external identity conflict guards

on:
  push:
    branches:
      - fix/external-identity-conflict-handling-20260908
    paths:
      - .github/workflows/apply-external-identity-conflicts-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-identity-conflict-handling-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python3 .github/fix_preference_reconcile.py
      - name: Run full tests
        run: |
          node --check api/envios.js
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove temporary files and commit
        run: |
          rm .github/fix_preference_reconcile.py
          rm .github/workflows/apply-external-identity-conflicts-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/envios.js .github/fix_preference_reconcile.py .github/workflows/apply-external-identity-conflicts-temp.yml
          git commit -m "Preserve pending guard during preference reconciliation"
          git push origin HEAD:fix/external-identity-conflict-handling-20260908
