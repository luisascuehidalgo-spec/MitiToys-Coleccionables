name: Apply shipment race and inventory guards

on:
  push:
    branches:
      - fix/enviopack-state-guard-20260907

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enviopack-state-guard-20260907

      - name: Apply race guards
        run: python scripts/apply_shipment_race_guard_temp.py

      - name: Commit applied changes
        run: |
          rm .github/workflows/apply-shipment-race-guard-temp.yml
          rm scripts/apply_shipment_race_guard_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/webhook-mercadopago.js api/admin.js .github/workflows/apply-shipment-race-guard-temp.yml scripts/apply_shipment_race_guard_temp.py
          git commit -m "Guard stock across payment and shipment races"
          git push origin HEAD:fix/enviopack-state-guard-20260907
