name: Apply order state hardening
on:
  push:
    branches: [fix/order-state-and-legacy-checkout-20260907]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-state-and-legacy-checkout-20260907
      - name: Patch order state surfaces
        shell: python
        run: |
          from pathlib import Path

          # Backend admin: use the shared provider-backed transition guard.
          p = Path('api/admin.js')
          s = p.read_text()
          needle = "const { expirePreference } = require('../lib/payments');\n"
          if needle not in s:
            raise SystemExit('admin import anchor not found')
          s = s.replace(needle, needle + "const { adminStatusError } = require('../lib/order-state');\n", 1)
          old = """      if(previous.status!==status && status==='refunded' && !['refunded','charged_back'].includes(String(previous.payment_status||''))) {\n        return res.status(409).json({error:'El pedido solo puede marcarse como reembolsado cuando Mercado Pago confirme el reembolso.'});\n      }\n      if(previous.status!==status && status==='cancelled' && previous.payment_id && !['cancelled','rejected'].includes(String(previous.payment_status||''))) {\n        return res.status(409).json({error:'Este pedido ya tiene un pago en Mercado Pago. Cancelalo o reembolsalo primero desde Mercado Pago.'});\n      }\n"""
          new = """      const transitionError=adminStatusError({currentStatus:previous.status,targetStatus:status,paymentId:previous.payment_id,paymentStatus:previous.payment_status});\n      if(transitionError) return res.status(409).json({error:transitionError});\n"""
          if old not in s:
            raise SystemExit('admin transition block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Admin UI: only offer statuses consistent with Mercado Pago's current state.
          p = Path('admin.html')
          s = p.read_text()
          marker = 'function renderOrders(){'
          if marker not in s:
            raise SystemExit('admin renderOrders anchor not found')
          helper = """const ORDER_STATUS_ORDER=['pending','approved','processing','shipped','delivered','cancelled','refunded'];function orderStatusOptions(o){const current=String(o.status||'pending'),payment=String(o.payment_status||'pending'),set=new Set([current]);if(payment==='approved'){['approved','processing','shipped','delivered'].forEach(x=>set.add(x))}else if(['refunded','charged_back'].includes(payment)){set.add('refunded')}else if(['cancelled','rejected'].includes(payment)){set.add('cancelled')}else{set.add('pending');if(!o.payment_id)set.add('cancelled')}return ORDER_STATUS_ORDER.filter(x=>set.has(x)).concat([...set].filter(x=>!ORDER_STATUS_ORDER.includes(x)))}"""
          s = s.replace(marker, helper + marker, 1)
          old_statuses = "['pending','approved','processing','shipped','delivered','cancelled','refunded'].map(s=>"
          if old_statuses not in s:
            raise SystemExit('admin status options anchor not found')
          s = s.replace(old_statuses, "orderStatusOptions(o).map(s=>", 1)
          p.write_text(s)

          # Public home fallback: never call the legacy payment endpoint.
          p = Path('index.html')
          s = p.read_text()
          start = s.find('async function pagar(productId,button){')
          end = s.find('\n(function(){const params=', start)
          if start < 0 or end < 0:
            raise SystemExit('legacy pagar function not found')
          safe = """function pagar(productId,button){const key=String(productId);try{if(window.MitiToysCart&&typeof window.MitiToysCart.add==='function'){window.MitiToysCart.add(key,1)}else{const raw=JSON.parse(localStorage.getItem('mititoys_cart')||'[]');const cart=Array.isArray(raw)?raw:[];const found=cart.find(x=>String(x.id)===key);if(found)found.qty=Math.max(1,Number(found.qty)||1)+1;else cart.push({id:key,qty:1});localStorage.setItem('mititoys_cart',JSON.stringify(cart))}}catch(_){}if(button){button.disabled=true;button.textContent='⏳ ABRIENDO CHECKOUT...'}window.location.href='/checkout.html?cart=1';}"""
          s = s[:start] + safe + s[end:]
          p.write_text(s)

          # All customer emails must point at the official production domain.
          p = Path('lib/notifications.js')
          s = p.read_text()
          old = "const SITE_URL = String(process.env.PUBLIC_SITE_URL || 'https://otaku-collectibles.vercel.app').replace(/\\/$/, '');"
          if old not in s:
            raise SystemExit('notification site URL anchor not found')
          s = s.replace(old, "const SITE_URL = 'https://mititoys.com';", 1)
          p.write_text(s)

          # Customer tracking: expose the new lifecycle events and sanitize logs.
          p = Path('api/estado-pedido.js')
          s = p.read_text()
          old_events = "['order.created','payment.created','payment.updated','enviopack.shipment_created','enviopack.synced','enviopack.admin_sync','admin.status_changed']"
          new_events = "['order.created','payment.created','payment.updated','payment.validation_failed','checkout.expired','enviopack.shipment_created','enviopack.synced','enviopack.admin_sync','admin.status_changed']"
          if old_events not in s:
            raise SystemExit('tracking timeline anchor not found')
          s = s.replace(old_events, new_events, 1)
          old_log = "console.error('estado-pedido error:', error);"
          if old_log not in s:
            raise SystemExit('tracking log anchor not found')
          s = s.replace(old_log, "console.error('estado-pedido error:', 'code=' + String(error?.code || error?.name || 'ORDER_STATUS_ERROR'), 'status=' + String(error?.status || 'unknown'));", 1)
          p.write_text(s)
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-order-state-hardening-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin.js admin.html index.html lib/notifications.js api/estado-pedido.js .github/workflows/apply-order-state-hardening-temp.yml
          git commit -m "Enforce provider-backed order states and safe checkout routing"
          git push origin HEAD:fix/order-state-and-legacy-checkout-20260907
