name: Apply final fulfillment guards

on:
  push:
    branches:
      - fix/enviopack-state-guard-20260907

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enviopack-state-guard-20260907

      - name: Apply final guards
        run: python scripts/apply_final_fulfillment_guards_temp.py

      - name: Commit applied changes
        run: |
          rm .github/workflows/apply-final-fulfillment-guards-temp.yml
          rm scripts/apply_final_fulfillment_guards_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin.js api/envios.js .github/workflows/apply-final-fulfillment-guards-temp.yml scripts/apply_final_fulfillment_guards_temp.py
          git commit -m "Fix fulfillment race scope and notification guards"
          git push origin HEAD:fix/enviopack-state-guard-20260907
