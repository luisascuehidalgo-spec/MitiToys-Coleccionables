name: Apply payment lifecycle hardening
on:
  push:
    branches: [fix/payment-stock-lifecycle-20260907]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-stock-lifecycle-20260907
      - name: Patch admin, webhook and cron
        shell: python
        run: |
          from pathlib import Path

          # Admin: provider-aware cancellation/refund and idempotent stock release.
          p = Path('api/admin.js')
          s = p.read_text()
          s = s.replace(
            "const { searchParams } = require('../lib/request-url');\n",
            "const { searchParams } = require('../lib/request-url');\nconst { releaseReservedStock } = require('../lib/inventory');\nconst { expirePreference } = require('../lib/payments');\n",
            1
          )
          old = """      const before=await sql`SELECT status FROM orders WHERE id=${id}`;\n      if(!before.length) return res.status(404).json({error:'Pedido no encontrado.'});\n      const shippingStatus=status==='shipped'?'in_transit':status==='delivered'?'delivered':status==='processing'?'preparing':'not_shipped';"""
          new = """      const before=await sql`SELECT status,payment_id,payment_status,preference_id FROM orders WHERE id=${id}`;\n      if(!before.length) return res.status(404).json({error:'Pedido no encontrado.'});\n      const previous=before[0];\n      if(previous.status!==status && status==='refunded' && !['refunded','charged_back'].includes(String(previous.payment_status||''))) {\n        return res.status(409).json({error:'El pedido solo puede marcarse como reembolsado cuando Mercado Pago confirme el reembolso.'});\n      }\n      if(previous.status!==status && status==='cancelled' && previous.payment_id && !['cancelled','rejected'].includes(String(previous.payment_status||''))) {\n        return res.status(409).json({error:'Este pedido ya tiene un pago en Mercado Pago. Cancelalo o reembolsalo primero desde Mercado Pago.'});\n      }\n      if(previous.status!==status && status==='cancelled' && !previous.payment_id && previous.preference_id) {\n        try { await expirePreference(previous.preference_id); }\n        catch(error) {\n          console.warn('Mercado Pago preference expiration failed:', 'code=' + String(error?.code || 'MP_PREFERENCE_EXPIRE_FAILED'), 'status=' + String(error?.providerStatus || 'unknown'));\n          return res.status(502).json({error:'No se pudo cancelar de forma segura el enlace de pago. No se modificó el pedido.'});\n        }\n      }\n      const shippingStatus=status==='shipped'?'in_transit':status==='delivered'?'delivered':status==='processing'?'preparing':'not_shipped';"""
          if old not in s:
            raise SystemExit('admin status block not found')
          s = s.replace(old, new, 1)
          old2 = """      const rows=await sql`UPDATE orders SET status=${status},shipping_status=${shippingStatus},shipping_recipient=${recipient},shipping_address=${address||null},shipping_street=${street},shipping_number=${number},shipping_floor=${floor},shipping_unit=${unit},shipping_city=${city},shipping_postal_code=${postal},shipping_phone=${phone},shipping_notes=${notes},shipping_carrier=${carrier},tracking_number=${tracking},updated_at=NOW() WHERE id=${id} RETURNING *`;\n      if(before[0].status!==status){"""
          new2 = """      const rows=await sql`UPDATE orders SET status=${status},shipping_status=${shippingStatus},shipping_recipient=${recipient},shipping_address=${address||null},shipping_street=${street},shipping_number=${number},shipping_floor=${floor},shipping_unit=${unit},shipping_city=${city},shipping_postal_code=${postal},shipping_phone=${phone},shipping_notes=${notes},shipping_carrier=${carrier},tracking_number=${tracking},updated_at=NOW() WHERE id=${id} RETURNING *`;\n      if(previous.status!==status && (status==='cancelled'||status==='refunded')) {\n        await releaseReservedStock(sql,id,status==='refunded'?'Liberación por reembolso confirmado':'Liberación por cancelación confirmada');\n      }\n      if(previous.status!==status){"""
          if old2 not in s:
            raise SystemExit('admin update block not found')
          s = s.replace(old2, new2, 1)
          s = s.replace("if(before[0].status!==status){", "if(previous.status!==status){")
          s = s.replace("${before[0].status}", "${previous.status}")
          p.write_text(s)

          # Mercado Pago webhook: reuse the DB-idempotent release helper and redact provider bodies/errors.
          p = Path('api/webhook-mercadopago.js')
          s = p.read_text()
          s = s.replace(
            "const{searchParams}=require('../lib/request-url');const{queueAndSendOrderNotification}=require('../lib/notifications');",
            "const{searchParams}=require('../lib/request-url');const{releaseReservedStock}=require('../lib/inventory');const{queueAndSendOrderNotification}=require('../lib/notifications');",
            1
          )
          start = s.find("if(newStatus==='cancelled'||newStatus==='refunded'){")
          end = s.find("await sql`INSERT INTO order_events", start)
          if start < 0 or end < 0:
            raise SystemExit('webhook release block not found')
          replacement = "if(newStatus==='cancelled'||newStatus==='refunded'){await releaseReservedStock(sql,order.id,newStatus==='refunded'?'Liberación por reembolso':'Liberación por rechazo/cancelación')}"
          s = s[:start] + replacement + s[end:]
          s = s.replace("console.error('Error consultando pago en Mercado Pago:',payment);", "console.error('Error consultando pago en Mercado Pago:', 'status=' + String(paymentResponse.status));")
          s = s.replace("console.error('Webhook Mercado Pago error:',error);", "console.error('Webhook Mercado Pago error:', 'code=' + String(error?.code || error?.name || 'WEBHOOK_ERROR'), 'status=' + String(error?.providerStatus || error?.status || 'unknown'));")
          p.write_text(s)

          # Run cleanup hourly; Vercel Preview/build will reject it if unsupported by the project plan.
          p = Path('vercel.json')
          s = p.read_text().replace('"schedule": "0 14 * * *"', '"schedule": "0 * * * *"')
          p.write_text(s)
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-payment-lifecycle-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin.js api/webhook-mercadopago.js vercel.json .github/workflows/apply-payment-lifecycle-temp.yml
          git commit -m "Harden payment cancellation and abandoned stock cleanup"
          git push origin HEAD:fix/payment-stock-lifecycle-20260907
