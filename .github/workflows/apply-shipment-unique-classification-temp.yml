name: Apply shipment uniqueness classification

on:
  push:
    branches:
      - fix/shipment-unique-error-classification-20260908
    paths:
      - .github/workflows/apply-shipment-unique-classification-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shipment-unique-error-classification-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact patch and regression
        run: python3 .github/patch_shipment_unique_classification.py
      - name: Validate syntax and tests
        run: |
          node --check api/admin.js
          node --check lib/external-identities.js
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove temporary files and commit
        run: |
          rm .github/patch_shipment_unique_classification.py
          rm .github/workflows/apply-shipment-unique-classification-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin.js test/external-identity-conflicts.test.js .github/patch_shipment_unique_classification.py .github/workflows/apply-shipment-unique-classification-temp.yml
          git commit -m "Classify shipment uniqueness conflicts precisely"
          git push origin HEAD:fix/shipment-unique-error-classification-20260908
