name: Inventory req.query usage

on:
  push:
    branches:
      - fix/whatwg-query-parsing-20260907

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: List req.query usages
        shell: bash
        run: |
          echo '=== req.query usages ==='
          git grep -n -F 'req.query' -- '*.js' '*.mjs' '*.cjs' || true
