name: Retire Neon binary image traffic
on:
  push:
    branches:
      - fix/neon-transfer-retire-binary-images-20260907
    paths:
      - .github/workflows/neon-transfer-retirement-temp.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/neon-transfer-retire-binary-images-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove legacy binary image traffic and enable short CDN catalog cache
        shell: python
        run: |
          from pathlib import Path

          catalog_path = Path('catalogo-dinamico.js')
          catalog = catalog_path.read_text()
          catalog = catalog.replace("const CACHE_KEY = 'mititoys_catalog_cache_v3';", "const CACHE_KEY = 'mititoys_catalog_cache_v4';")

          fallback = """  const FALLBACK_3431 = {\n    id: '3431',\n    title: 'Figura Luffy Gear 5 – Nika – One Piece – 23 cm',\n    description: 'Figura coleccionable de Luffy Gear 5 / Nika de One Piece, 23 cm. Ideal para colección y exhibición.',\n    price: 120000,\n    stock_quantity: 5,\n    stock_managed: true,\n    active: true,\n    created_at: '2026-09-03T11:31:51.645Z',\n    images: ['/api/product-image?id=4', '/api/product-image?id=5']\n  };\n\n"""
          if fallback not in catalog:
            raise SystemExit('legacy fallback block not found')
          catalog = catalog.replace(fallback, '')

          old_images = "const images = Array.isArray(product.images) ? product.images.filter(Boolean).slice(0, 4) : [];"
          new_images = "const images = Array.isArray(product.images) ? product.images.filter(url => url && !/^\\/api\\/product-image(?:\\?|$)/.test(String(url))).slice(0, 4) : [];"
          if old_images not in catalog:
            raise SystemExit('catalog image normalization target not found')
          catalog = catalog.replace(old_images, new_images)

          old_fetch = """      const response = await fetch(`/api/productos?cb=${Date.now()}`, {\n        cache: 'no-store',\n        headers: { Accept: 'application/json' }\n      });"""
          new_fetch = """      const response = await fetch('/api/productos', {\n        headers: { Accept: 'application/json' }\n      });"""
          if old_fetch not in catalog:
            raise SystemExit('catalog cache-busting fetch target not found')
          catalog = catalog.replace(old_fetch, new_fetch)

          old_catch = """    } catch (error) {\n      console.error('catalogo-dinamico api:', error);\n      if (!grid.querySelector('.catalog-card')) grid.innerHTML = '';\n      if (!grid.querySelector('[data-product-id=\"3431\"]')) renderProduct(grid, FALLBACK_3431, grid.children.length);\n      refresh();\n    } finally {"""
          new_catch = """    } catch (error) {\n      console.error('catalogo-dinamico api:', error);\n      if (!grid.querySelector('.catalog-card')) {\n        grid.innerHTML = '<p class=\"muted\" style=\"padding:20px\">No pudimos cargar el catálogo en este momento. Intentá nuevamente en unos minutos.</p>';\n        if (count) count.textContent = 'Catálogo temporalmente no disponible';\n      } else {\n        refresh();\n      }\n    } finally {"""
          if old_catch not in catalog:
            raise SystemExit('catalog fallback catch target not found')
          catalog = catalog.replace(old_catch, new_catch)
          catalog_path.write_text(catalog)

          products_path = Path('api/productos.js')
          products = products_path.read_text()

          old_review = """      const image = await sql`SELECT id FROM product_images WHERE product_id=${rows[0].product_id} ORDER BY sort_order,id LIMIT 1`;\n      return res.status(200).json({ review: { ...rows[0], image: image.length ? '/api/product-image?id=' + image[0].id : rows[0].legacy_image } });"""
          new_review = """      res.setHeader('Cache-Control', 'private, no-store');\n      return res.status(200).json({ review: { ...rows[0], image: rows[0].legacy_image } });"""
          if old_review not in products:
            raise SystemExit('review legacy image target not found')
          products = products.replace(old_review, new_review)

          old_uploaded = """    const uploaded = await sql`SELECT id,product_id,sort_order FROM product_images ORDER BY product_id,sort_order,id`;\n    const byProduct = new Map();\n    for (const image of uploaded) {\n      if (!byProduct.has(image.product_id)) byProduct.set(image.product_id, []);\n      byProduct.get(image.product_id).push({ id: image.id, url: `/api/product-image?id=${image.id}`, sort_order: image.sort_order });\n    }\n    const result = products.map(product => {\n      const legacy = Array.isArray(product.images) ? product.images.filter(Boolean) : [];\n      const stored = byProduct.get(product.id) || [];\n      return { ...product, rating: Number(product.rating || 0), reviews_count: Number(product.reviews_count || 0), images: [...legacy, ...stored.map(image => image.url)].slice(0, 8) };\n    });"""
          new_uploaded = """    const result = products.map(product => ({\n      ...product,\n      rating: Number(product.rating || 0),\n      reviews_count: Number(product.reviews_count || 0),\n      images: Array.isArray(product.images) ? product.images.filter(Boolean).slice(0, 8) : []\n    }));"""
          if old_uploaded not in products:
            raise SystemExit('public product_images merge target not found')
          products = products.replace(old_uploaded, new_uploaded)

          old_cache = "res.setHeader('Cache-Control', 'no-store, max-age=0');\n    return res.status(200).json({ products: result, reviews });"
          new_cache = "res.setHeader('Cache-Control', 'public, max-age=0, s-maxage=60, stale-while-revalidate=300');\n    return res.status(200).json({ products: result, reviews });"
          if old_cache not in products:
            raise SystemExit('public catalog cache header target not found')
          products = products.replace(old_cache, new_cache)
          products_path.write_text(products)

          Path('api/product-image.js').write_text("""// Legacy compatibility endpoint. Product images were migrated out of Neon.\n// Keep this route DB-free so stale browser URLs can never consume database transfer.\nmodule.exports = async (req, res) => {\n  if (req.method !== 'GET') return res.status(405).end();\n  res.setHeader('Cache-Control', 'public, max-age=86400, s-maxage=86400, immutable');\n  return res.status(410).end();\n};\n""")

          Path('test/neon-transfer-regression.test.js').write_text(r"""const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const root = path.join(__dirname, '..');
const read = file => fs.readFileSync(path.join(root, file), 'utf8');

test('catálogo público no fuerza cache miss ni referencia imágenes binarias de Neon', () => {
  const catalog = read('catalogo-dinamico.js');
  assert.match(catalog, /fetch\('\/api\/productos'/);
  assert.doesNotMatch(catalog, /\/api\/productos\?cb=/);
  assert.doesNotMatch(catalog, /cache:\s*['\"]no-store['\"]/);
  assert.doesNotMatch(catalog, /images:\s*\[[^\]]*\/api\/product-image/);
  assert.match(catalog, /mititoys_catalog_cache_v4/);
});

test('API pública de productos no consulta product_images y usa caché CDN corta', () => {
  const products = read('api/productos.js');
  assert.doesNotMatch(products, /FROM product_images|JOIN product_images/);
  assert.doesNotMatch(products, /\/api\/product-image/);
  assert.match(products, /s-maxage=60/);
  assert.match(products, /stale-while-revalidate=300/);
  assert.match(products, /private, no-store/);
});

test('endpoint legado de imagen no abre Neon y responde 410', async () => {
  const source = read('api/product-image.js');
  assert.doesNotMatch(source, /getDb|product_images|image_data/);
  assert.match(source, /status\(410\)/);

  const handler = require('../api/product-image');
  const headers = {};
  let statusCode = 200;
  let ended = false;
  const res = {
    status(code) { statusCode = code; return this; },
    setHeader(name, value) { headers[name.toLowerCase()] = value; },
    end() { ended = true; return this; }
  };
  await handler({ method: 'GET' }, res);
  assert.equal(statusCode, 410);
  assert.equal(ended, true);
  assert.match(headers['cache-control'], /max-age=86400/);
});
""")
      - name: Run full regression suite
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove temporary workflow and commit verified patch
        run: |
          rm .github/workflows/neon-transfer-retirement-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo-dinamico.js api/productos.js api/product-image.js test/neon-transfer-regression.test.js .github/workflows/neon-transfer-retirement-temp.yml
          git commit -m "Retire Neon binary image delivery and cache catalog"
          git push origin HEAD:fix/neon-transfer-retire-binary-images-20260907
