name: Apply WHATWG query parsing fix

on:
  push:
    branches:
      - fix/whatwg-query-parsing-20260907

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatwg-query-parsing-20260907
      - name: Replace Vercel req.query getter usage
        shell: python
        run: |
          from pathlib import Path

          Path('lib/request-url.js').write_text("""function searchParams(req) {
            return new URL(req?.url || '/', 'http://localhost').searchParams;
          }

          module.exports = { searchParams };
          """)

          Path('lib/db.js').write_text("""const { neon } = require('@neondatabase/serverless');

          function getDb() {
            const url = process.env.DATABASE_URL;
            if (!url) throw new Error('Falta configurar DATABASE_URL.');
            return neon(url);
          }

          module.exports = { getDb };
          """)

          def replace(path, old, new, count=None):
            p = Path(path)
            text = p.read_text()
            actual = text.count(old)
            expected = 1 if count is None else count
            if actual != expected:
              raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {actual}')
            p.write_text(text.replace(old, new, expected))

          # admin-image.js
          replace('api/admin-image.js', "const { verify } = require('./admin-auth');\n", "const { verify } = require('./admin-auth');\nconst { searchParams } = require('../lib/request-url');\n")
          replace('api/admin-image.js', "module.exports = async (req, res) => {\n", "module.exports = async (req, res) => {\n  const query = searchParams(req);\n")
          replace('api/admin-image.js', "req.query?.productId", "query.get('productId')")
          replace('api/admin-image.js', "req.query?.id", "query.get('id')")

          # admin.js
          replace('api/admin.js', "const { verify } = require('./admin-auth');\n", "const { verify } = require('./admin-auth');\nconst { searchParams } = require('../lib/request-url');\n")
          replace('api/admin.js', "module.exports = async (req,res)=>{\n", "module.exports = async (req,res)=>{\n  const query=searchParams(req);\n")
          replace('api/admin.js', "req.query?.action", "query.get('action')")
          replace('api/admin.js', "req.query?.id", "query.get('id')")

          # envios.js
          replace('api/envios.js', "const { getDb } = require('../lib/db');\n", "const { getDb } = require('../lib/db');\nconst { searchParams } = require('../lib/request-url');\n")
          replace('api/envios.js', "module.exports = async (req, res) => {\n", "module.exports = async (req, res) => {\n  const query = searchParams(req);\n")
          replace('api/envios.js', "req.query?.tipo", "query.get('tipo')")
          replace('api/envios.js', "req.query?.id", "query.get('id')")
          replace('api/envios.js', "req.query?.action", "query.get('action')", 2)
          replace('api/envios.js', "req.query?.province", "query.get('province')")

          # estado-pedido.js
          replace('api/estado-pedido.js', "const { ensureReviewInvites } = require('../lib/notifications');\n", "const { ensureReviewInvites } = require('../lib/notifications');\nconst { searchParams } = require('../lib/request-url');\n")
          replace('api/estado-pedido.js', "  try {\n", "  try {\n    const query = searchParams(req);\n")
          replace('api/estado-pedido.js', "req.query?.pedido", "query.get('pedido')")
          replace('api/estado-pedido.js', "req.query?.email", "query.get('email')")

          # product-image.js
          replace('api/product-image.js', "const { getDb } = require('../lib/db');\n", "const { getDb } = require('../lib/db');\nconst { searchParams } = require('../lib/request-url');\n")
          replace('api/product-image.js', "  const id = Number(req.query?.id);", "  const id = Number(searchParams(req).get('id'));")

          # productos.js
          replace('api/productos.js', "const { getDb } = require('../lib/db');\n", "const { getDb } = require('../lib/db');\nconst { searchParams } = require('../lib/request-url');\n")
          replace('api/productos.js', "module.exports = async (req, res) => {\n  const sql = getDb();", "module.exports = async (req, res) => {\n  const query = searchParams(req);\n  const sql = getDb();")
          replace('api/productos.js', "req.query?.sitemap", "query.get('sitemap')")
          replace('api/productos.js', "req.query?.review_token", "query.get('review_token')")
          replace('api/productos.js', "req.query.review_token", "query.get('review_token')")
          replace('api/productos.js', "req.query?.id", "query.get('id')")

          # webhook-mercadopago.js
          replace('api/webhook-mercadopago.js', "const crypto=require('crypto');const{getDb}=require('../lib/db');", "const crypto=require('crypto');const{getDb}=require('../lib/db');const{searchParams}=require('../lib/request-url');")
          replace('api/webhook-mercadopago.js', "try{const body=req.body||{};const dataId=body?.data?.id||req.query?.['data.id']||req.query?.id;const type=body?.type||req.query?.type;", "try{const body=req.body||{};const query=searchParams(req);const dataId=body?.data?.id||query.get('data.id')||query.get('id');const type=body?.type||query.get('type');")

          Path('test/request-url.test.js').write_text("""const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { searchParams } = require('../lib/request-url');

          test('parsea query params con WHATWG URL sin depender de req.query', () => {
            const query = searchParams({ url: '/api/productos?id=3377&review_token=a%20b&data.id=123' });
            assert.equal(query.get('id'), '3377');
            assert.equal(query.get('review_token'), 'a b');
            assert.equal(query.get('data.id'), '123');
          });

          test('acepta URL absoluta y request sin url', () => {
            assert.equal(searchParams({ url: 'https://mititoys.com/api/envios?action=localities' }).get('action'), 'localities');
            assert.equal(searchParams({}).toString(), '');
          });

          test('ninguna API usa el getter legacy req.query de Vercel', () => {
            const apiDir = path.join(__dirname, '..', 'api');
            const offenders = [];
            for (const file of fs.readdirSync(apiDir).filter(name => name.endsWith('.js'))) {
              const source = fs.readFileSync(path.join(apiDir, file), 'utf8');
              if (/\\breq\\.query\\b/.test(source)) offenders.push(file);
            }
            assert.deepEqual(offenders, []);
          });

          test('lib/db no conserva el listener diagnóstico DEP0169', () => {
            const source = fs.readFileSync(path.join(__dirname, '..', 'lib', 'db.js'), 'utf8');
            assert.doesNotMatch(source, /DEP0169|process\\.on\\(['\"]warning['\"]/);
          });
          """)
      - name: Verify inventory is clean
        shell: bash
        run: |
          if git grep -n -F 'req.query' -- 'api/*.js'; then
            echo 'req.query remains in API code'
            exit 1
          fi
      - name: Commit permanent fix and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/query-getter-inventory-temp.yml .github/workflows/apply-whatwg-query-fix-temp.yml
          git add api lib test
          git commit -m "Replace Vercel req.query with WHATWG URL parsing"
          git push origin fix/whatwg-query-parsing-20260907
