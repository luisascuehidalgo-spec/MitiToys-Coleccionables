name: mp-webhook-timeout
on:
  push:
    branches:
      - fix/mercadopago-webhook-timeout-20260908
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mercadopago-webhook-timeout-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 scripts/apply-mp-webhook-timeout-temp.py
      - run: |
          node --check api/webhook-mercadopago.js
          node --check lib/payments.js
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - run: |
          rm .github/workflows/apply-mp-webhook-timeout-temp.yml
          rm scripts/apply-mp-webhook-timeout-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/webhook-mercadopago.js .github/workflows/apply-mp-webhook-timeout-temp.yml scripts/apply-mp-webhook-timeout-temp.py
          git commit -m "Bound Mercado Pago webhook payment lookup"
          git push origin HEAD:fix/mercadopago-webhook-timeout-20260908
