name: Apply public catalog consumer cache fixes
on:
  push:
    branches:
      - fix/neon-transfer-retire-binary-images-20260907
    paths:
      - .github/workflows/apply-public-catalog-consumer-cache-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/neon-transfer-retire-binary-images-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch remaining public catalog consumers
        run: |
          python3 <<'PY'
          from pathlib import Path

          logo = 'https://raw.githubusercontent.com/luisascuehidalgo-spec/imagenes/main/WhatsApp%20Image%202026-09-01%20at%208.31.48%20PM.jpeg'
          luffy1 = 'https://user30281.na.imgto.link/public/20260906/chatgpt-image-3-sept-2026-01-19-21-p-m.avif'
          luffy2 = 'https://user30281.na.imgto.link/public/20260906/chatgpt-image-3-sept-2026-01-21-41-p-m.avif'

          product_path = Path('producto.html')
          product = product_path.read_text()
          replacements = [
              ('<meta property="og:image" content="https://mititoys.com/api/product-image?id=29">', f'<meta property="og:image" content="{logo}">'),
              ('<meta name="twitter:image" content="https://mititoys.com/api/product-image?id=29">', f'<meta name="twitter:image" content="{logo}">'),
              ("'3431':{id:'3431',title:'FIGURA LUFFY GEAR 5 – NIKA – ONE PIECE – 23 CM',description:'Figura coleccionable de Luffy Gear 5 / Nika de One Piece, 23 cm. Ideal para colección y exhibición.',price:120000,active:true,images:['/api/product-image?id=2','/api/product-image?id=3']}",
               f"'3431':{{id:'3431',title:'FIGURA LUFFY GEAR 5 – NIKA – ONE PIECE – 23 CM',description:'Figura coleccionable de Luffy Gear 5 / Nika de One Piece, 23 cm. Ideal para colección y exhibición.',price:120000,active:true,images:['{luffy1}','{luffy2}']}}"),
              ("fetch('/api/productos?id='+encodeURIComponent(productId)+'&cb='+Date.now(),{cache:'no-store'})",
               "fetch('/api/productos?id='+encodeURIComponent(productId))"),
              ("fetch('/api/productos?cb='+Date.now(),{cache:'no-store'})",
               "fetch('/api/productos')"),
          ]
          for old, new in replacements:
              if old not in product:
                  raise SystemExit('producto target missing: ' + old[:100])
              product = product.replace(old, new)
          product_path.write_text(product)

          cart_path = Path('carrito.html')
          cart = cart_path.read_text()
          old = "fetch('/api/productos?cb='+Date.now(),{cache:'no-store'})"
          if old not in cart:
              raise SystemExit('carrito cache-busting target missing')
          cart = cart.replace(old, "fetch('/api/productos')")
          cart_path.write_text(cart)

          checkout_path = Path('checkout.html')
          checkout = checkout_path.read_text()
          old = "fetch('/api/productos?cb=' + Date.now(), { cache: 'no-store' })"
          if old not in checkout:
              raise SystemExit('checkout cache-busting target missing')
          checkout = checkout.replace(old, "fetch('/api/productos')")
          checkout_path.write_text(checkout)

          test_path = Path('test/neon-transfer-regression.test.js')
          tests = test_path.read_text()
          insert = """

test('ficha, carrito y checkout tampoco fuerzan misses del catálogo ni usan imágenes binarias', () => {
  for (const file of ['producto.html', 'carrito.html', 'checkout.html']) {
    const source = read(file);
    assert.doesNotMatch(source, /\/api\/productos(?:\?[^'\"\s]*)?\?cb=|\/api\/productos\?cb=/);
    assert.doesNotMatch(source, /\/api\/product-image/);
  }
  assert.match(read('producto.html'), /fetch\('\/api\/productos'\)/);
  assert.match(read('carrito.html'), /fetch\('\/api\/productos'\)/);
  assert.match(read('checkout.html'), /fetch\('\/api\/productos'\)/);
});
"""
          marker = "\ntest('endpoint legado de imagen no abre Neon y responde 410', async () => {"
          if marker not in tests:
              raise SystemExit('test insertion marker missing')
          tests = tests.replace(marker, insert + marker)
          test_path.write_text(tests)
          PY
      - name: Validate JavaScript and run regressions
        run: |
          node --check catalogo-dinamico.js
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-public-catalog-consumer-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add producto.html carrito.html checkout.html test/neon-transfer-regression.test.js .github/workflows/apply-public-catalog-consumer-cache-fix.yml
          git commit -m "Remove cache busting from remaining public catalog consumers"
          git push origin HEAD:fix/neon-transfer-retire-binary-images-20260907
