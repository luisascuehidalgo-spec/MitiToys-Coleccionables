name: Update request URL test mocks

on:
  push:
    branches:
      - fix/whatwg-query-parsing-20260907

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatwg-query-parsing-20260907
      - name: Make image request mocks use req.url
        shell: python
        run: |
          from pathlib import Path
          p = Path('test/images.test.js')
          text = p.read_text()
          old = "  Object.assign(req,{method,body,query:params,headers:{'content-type':mime,cookie:authorized?'mititoys_admin='+Buffer.from(value+'.'+signature).toString('base64url'):''}});"
          new = "  const search=new URLSearchParams(params||{}).toString();\n  Object.assign(req,{method,body,url:'/api/admin-image'+(search?'?'+search:''),headers:{'content-type':mime,cookie:authorized?'mititoys_admin='+Buffer.from(value+'.'+signature).toString('base64url'):''}});"
          if text.count(old) != 1:
            raise SystemExit('expected image request mock line not found exactly once')
          p.write_text(text.replace(old, new, 1))
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-query-test-mocks-temp.yml
          git add test/images.test.js
          git commit -m "Update image mocks to use request URLs"
          git push origin fix/whatwg-query-parsing-20260907
