<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Estado de pedido</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:45px 18px}.card{background:#121212;border:1px solid #292929;border-radius:18px;padding:28px}.brand{color:#ffd21c;font-size:27px;font-weight:900}.status{font-size:22px;font-weight:900;padding:16px;border-radius:10px;background:#191919;margin:20px 0}.green{color:#6cff75}.yellow{color:#ffd21c}.red{color:#ff6b6b}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #292929}.muted{color:#999;line-height:1.5}.btn{display:inline-block;background:#ef2525;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:900;margin-top:22px}</style></head><body><div class="wrap"><div class="card"><div class="brand">Mititoys coleccionables</div><p class="muted">Seguimiento de tu pedido</p><div id="content">Consultando pedido...</div><a class="btn" href="/">← Volver a la tienda</a></div></div><script>const q=new URLSearchParams(location.search),n=q.get('pedido'),content=document.getElementById('content');const money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v||0));const labels={pending:['Pago pendiente','yellow'],approved:['Pago aprobado','green'],processing:['Pedido en preparación','yellow'],shipped:['Pedido enviado','green'],delivered:['Pedido entregado','green'],cancelled:['Pedido cancelado','red'],refunded:['Pago reembolsado','red']};async function run(){if(!n){content.innerHTML='<p class="red">No se indicó un número de pedido.</p>';return}try{const r=await fetch('/api/estado-pedido?pedido='+encodeURIComponent(n),{cache:'no-store'});if(!r.ok)throw 0;const {order:o}=await r.json(),l=labels[o.status]||['Estado: '+o.status,'yellow'];content.innerHTML=`<div class="status ${l[1]}">${l[0]}</div><div class="row"><span>Pedido</span><b>${o.order_number}</b></div><div class="row"><span>Producto</span><b>${o.product_title}</b></div><div class="row"><span>Total</span><b>${money(o.total_amount)}</b></div><div class="row"><span>Pago</span><b>${o.payment_status||'Pendiente'}${o.payment_status_detail?' · '+o.payment_status_detail:''}</b></div><div class="row"><span>Envío</span><b>${o.shipping_status||'Pendiente de preparación'}</b></div>${o.shipping_recipient?`<div class="row"><span>Destinatario</span><b>${o.shipping_recipient}</b></div>`:''}${o.shipping_carrier?`<div class="row"><span>Transportista</span><b>${o.shipping_carrier}</b></div>`:''}${o.tracking_number?`<div class="row"><span>Seguimiento</span><b>${o.tracking_number}</b></div>`:''}<p class="muted">Te recomendamos guardar este número de pedido para futuras consultas.</p><p class="muted">Última actualización: ${new Date(o.updated_at).toLocaleString('es-AR')}</p>`}catch(e){content.innerHTML='<p class="red">No encontramos ese pedido. Verificá el número e intentá nuevamente.</p>'}}run();</script></body></html>
