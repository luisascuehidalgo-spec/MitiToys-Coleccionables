<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mititoys · Estado de pedido</title><style>:root{--yellow:#ffd21c;--red:#ef2525;--bg:#070707;--card:#121212;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:45px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}.brand{color:var(--yellow);font-size:27px;font-weight:900}.status{font-size:22px;font-weight:900;padding:16px;border-radius:10px;background:#191919;margin:20px 0}.green{color:#6cff75}.yellow{color:var(--yellow)}.red{color:#ff6b6b}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.items{margin:8px 0 14px;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.item{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #242424}.item:last-child{border-bottom:0}.muted{color:var(--muted);line-height:1.5}.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:900;margin-top:22px}.verify{margin-top:18px;background:#191919;border:1px solid #2d2d2d;border-radius:12px;padding:18px}.verify input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#0d0d0d;color:#fff;margin:8px 0}.verify button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><div class="brand">Mititoys coleccionables</div><p class="muted">Seguimiento seguro de tu pedido</p><div id="content">Preparando consulta...</div><a class="btn" href="/">← Volver a la tienda</a></div></div><script>const q=new URLSearchParams(location.search),n=q.get('pedido'),content=document.getElementById('content');const money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const shipLabels={not_shipped:'Pendiente de preparación',preparing:'Preparando el paquete',in_transit:'En camino',delivered:'Entregado',exception:'El correo informó una novedad'};const labels={pending:['Pago pendiente','yellow'],approved:['Pago aprobado','green'],processing:['Pedido en preparación','yellow'],shipped:['Pedido enviado','green'],delivered:['Pedido entregado','green'],cancelled:['Pedido cancelado','red'],refunded:['Pago reembolsado','red']};function askEmail(){content.innerHTML=`<div class="verify"><b>Confirmá el email de tu compra</b><p class="muted">Por seguridad, necesitamos validar el email antes de mostrar la información del pedido.</p><input id="verifyEmail" type="email" autocomplete="email" placeholder="tu@email.com"><button id="verifyBtn">VER MI PEDIDO</button></div>`;document.getElementById('verifyBtn').onclick=()=>{const email=document.getElementById('verifyEmail').value.trim().toLowerCase();if(!email)return;localStorage.setItem('mititoys_last_order_email',email);run(email)}}async function run(email){if(!n){content.innerHTML='<p class="red">No se indicó un número de pedido.</p><p><a style="color:#ffd21c" href="/seguimiento.html">Ir al seguimiento de pedidos</a></p>';return}if(!email){askEmail();return}content.innerHTML='<p class="muted">Consultando pedido...</p>';try{const r=await fetch('/api/estado-pedido?pedido='+encodeURIComponent(n)+'&email='+encodeURIComponent(email),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Pedido no encontrado.');const o=j.order,l=labels[o.status]||['Estado: '+o.status,'yellow'];const items=Array.isArray(o.items)&&o.items.length?`<div class="items">${o.items.map(i=>`<div class="item"><span>${esc(i.product_title)} × ${Number(i.quantity||0)}</span><b>${money(i.total_amount)}</b></div>`).join('')}</div>`:`<div class="row"><span>Producto</span><b>${esc(o.product_title)}</b></div>`;content.innerHTML=`<div class="status ${l[1]}">${l[0]}</div><div class="row"><span>Pedido</span><b>${esc(o.order_number)}</b></div><div style="padding-top:12px"><span class="muted">Productos</span>${items}</div><div class="row"><span>Total</span><b>${money(o.total_amount)}</b></div><div class="row"><span>Pago</span><b>${esc(o.payment_status||'Pendiente')}${o.payment_status_detail?' · '+esc(o.payment_status_detail):''}</b></div><div class="row"><span>Envío</span><b>${esc(shipLabels[o.shipping_status]||o.shipping_status||'Pendiente de preparación')}</b></div>${o.shipping_recipient?`<div class="row"><span>Destinatario</span><b>${esc(o.shipping_recipient)}</b></div>`:''}${o.shipping_carrier?`<div class="row"><span>Transportista</span><b>${esc(o.shipping_carrier)}</b></div>`:''}${o.shipping_destination_type==='branch'?`<div class="row"><span>Retiro en sucursal</span><b>${esc(o.shipping_branch_name||'Sucursal')}<br><small>${esc(o.shipping_branch_address||'')}</small></b></div>`:''}${o.tracking_number?`<div class="row"><span>Seguimiento</span><b>${esc(o.tracking_number)}</b></div>`:''}${Array.isArray(o.tracking_events)&&o.tracking_events.length?`<div class="items"><b>Movimientos del envío</b>${o.tracking_events.map(e=>`<div class="item"><span>${esc(e.message)}</span><small class="muted">${esc(e.date||'')}</small></div>`).join('')}</div>`:''}<p class="muted">Guardá tu número de pedido para futuras consultas.</p><p class="muted">Última actualización: ${new Date(o.updated_at).toLocaleString('es-AR')}</p>`}catch(e){localStorage.removeItem('mititoys_last_order_email');content.innerHTML=`<p class="red">${esc(e.message||'No encontramos ese pedido.')}</p><button class="btn" style="border:0;cursor:pointer" onclick="askEmail()">INTENTAR CON OTRO EMAIL</button>`}}const stored=localStorage.getItem('mititoys_last_order_email')||'';run(stored);</script></body></html>
